<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="grad-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="550" y="45" text-anchor="middle" fill="#f8fafc" font-size="26" font-weight="bold">ScholarSwarm AI — Agent Architecture &amp; Workflow</text>
  <text x="550" y="75" text-anchor="middle" fill="#94a3b8" font-size="14">Multi-Agent Swarm for University Research, Eligibility Verification &amp; Application Coaching</text>

  <!-- Top Container: Frontend & API Gateway -->
  <rect x="50" y="110" width="1000" height="120" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <text x="75" y="140" fill="#38bdf8" font-size="16" font-weight="bold">Frontend Dashboard (React, Vite, Tailwind CSS)</text>
  
  <rect x="75" y="155" width="280" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="215" y="180" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Student Profile &amp; Docs</text>
  <text x="215" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">GPA, Skills, Budget, Resume (PDF/DOCX)</text>

  <rect x="410" y="155" width="280" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="550" y="180" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Live Agent Activity Feed</text>
  <text x="550" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">SSE Stream with Real-time Status Badges</text>

  <rect x="745" y="155" width="280" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5" />
  <text x="885" y="180" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Results &amp; Coaching Hub</text>
  <text x="885" y="198" text-anchor="middle" fill="#94a3b8" font-size="11">Ranked Match Cards, SOP &amp; Checklist</text>

  <!-- Middle Connector Arrow -->
  <line x1="550" y1="230" x2="550" y2="280" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />
  <text x="565" y="260" fill="#38bdf8" font-size="12" font-weight="bold">POST /api/research</text>

  <!-- Middle Container: LangGraph Swarm Orchestrator -->
  <rect x="50" y="285" width="1000" height="380" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#shadow)" />
  <text x="75" y="318" fill="#38bdf8" font-size="18" font-weight="bold">LangGraph Multi-Agent Orchestrator (StateGraph)</text>

  <!-- Agent 1: Researcher -->
  <rect x="80" y="345" width="200" height="180" rx="10" fill="url(#grad-blue)" filter="url(#shadow)" />
  <text x="180" y="375" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">1. Researcher</text>
  <text x="180" y="395" text-anchor="middle" fill="#dbeafe" font-size="11">Finds ≥ 10 Programs</text>
  <line x1="95" y1="405" x2="265" y2="405" stroke="#93c5fd" stroke-width="1" />
  <text x="100" y="425" fill="#f8fafc" font-size="11">• Query university portals</text>
  <text x="100" y="445" fill="#f8fafc" font-size="11">• DAAD &amp; government awards</text>
  <text x="100" y="465" fill="#f8fafc" font-size="11">• Collect verified source URLs</text>
  <text x="100" y="485" fill="#f8fafc" font-size="11">• Filter by budget constraint</text>
  <text x="100" y="505" fill="#f8fafc" font-size="11">• Deduplicate candidate pool</text>

  <!-- Agent 1 to Agent 2 Arrow -->
  <line x1="280" y1="435" x2="320" y2="435" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Agent 2: Eligibility Verifier -->
  <rect x="325" y="345" width="200" height="180" rx="10" fill="url(#grad-purple)" filter="url(#shadow)" />
  <text x="425" y="375" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">2. Verifier</text>
  <text x="425" y="395" text-anchor="middle" fill="#ede9fe" font-size="11">Rigor &amp; Evidence Checking</text>
  <line x1="340" y1="405" x2="510" y2="405" stroke="#c4b5fd" stroke-width="1" />
  <text x="345" y="425" fill="#f8fafc" font-size="11">• Verify published GPA minimums</text>
  <text x="345" y="445" fill="#f8fafc" font-size="11">• Check IELTS/TOEFL cutoffs</text>
  <text x="345" y="465" fill="#f8fafc" font-size="11">• Flag prerequisite gaps</text>
  <text x="345" y="485" fill="#f8fafc" font-size="11">• Detect international eligibility</text>
  <text x="345" y="505" fill="#f8fafc" font-size="11">• Assign trust status tags</text>

  <!-- Agent 2 to Agent 3 Arrow -->
  <line x1="525" y1="435" x2="565" y2="435" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Agent 3: Opportunity Matcher -->
  <rect x="570" y="345" width="200" height="180" rx="10" fill="url(#grad-amber)" filter="url(#shadow)" />
  <text x="670" y="375" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">3. Matcher</text>
  <text x="670" y="395" text-anchor="middle" fill="#fef3c7" font-size="11">Multi-Factor Scoring</text>
  <line x1="585" y1="405" x2="755" y2="405" stroke="#fde68a" stroke-width="1" />
  <text x="590" y="425" fill="#f8fafc" font-size="11">• Academic Fit Score (35%)</text>
  <text x="590" y="445" fill="#f8fafc" font-size="11">• Funding &amp; Stipend Fit (30%)</text>
  <text x="590" y="465" fill="#f8fafc" font-size="11">• Eligibility Probability (25%)</text>
  <text x="590" y="485" fill="#f8fafc" font-size="11">• Career Relevance (10%)</text>
  <text x="590" y="505" fill="#f8fafc" font-size="11">• Pick Top 5 Tiered Matches</text>

  <!-- Agent 3 to Agent 4 Arrow -->
  <line x1="770" y1="435" x2="810" y2="435" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrow)" />

  <!-- Agent 4: Application Coach -->
  <rect x="815" y="345" width="205" height="180" rx="10" fill="url(#grad-green)" filter="url(#shadow)" />
  <text x="917" y="375" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">4. Coach</text>
  <text x="917" y="395" text-anchor="middle" fill="#d1fae5" font-size="11">SOP &amp; Strategic Timeline</text>
  <line x1="830" y1="405" x2="1005" y2="405" stroke="#6ee7b7" stroke-width="1" />
  <text x="835" y="425" fill="#f8fafc" font-size="11">• Personalized SOP Generation</text>
  <text x="835" y="445" fill="#f8fafc" font-size="11">• Connects student projects</text>
  <text x="835" y="465" fill="#f8fafc" font-size="11">• Program-specific faculty hook</text>
  <text x="835" y="485" fill="#f8fafc" font-size="11">• Application timeline checklist</text>
  <text x="835" y="505" fill="#f8fafc" font-size="11">• Letter of rec &amp; visa guidance</text>

  <!-- Orchestrator State Summary Box -->
  <rect x="80" y="550" width="940" height="90" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
  <text x="100" y="575" fill="#38bdf8" font-size="13" font-weight="bold">Shared Workflow State (Pydantic WorkflowState)</text>
  <text x="100" y="598" fill="#94a3b8" font-size="12">Immutable Checkpointing: Student Profile, Candidate Opportunities [10+], Verified Criteria, Top 5 Ranked List, SOP Draft, Milestone Checklists</text>
  <text x="100" y="620" fill="#cbd5e1" font-size="12">Fault Tolerance: Automatic retries, partial result preservation, and zero-downtime demo mode fallback</text>

  <!-- Bottom Container: External Integrations & Tooling -->
  <rect x="50" y="690" width="1000" height="110" rx="12" fill="#1e293b" stroke="#334155" stroke-width="2" filter="url(#shadow)" />
  <text x="75" y="720" fill="#f59e0b" font-size="15" font-weight="bold">External Tools &amp; Web Research Layer</text>

  <rect x="75" y="735" width="220" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="185" y="763" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="500">DuckDuckGo &amp; Tavily API</text>

  <rect x="320" y="735" width="220" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="430" y="763" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="500">Official University Scraper</text>

  <rect x="565" y="735" width="220" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="675" y="763" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="500">PDF &amp; DOCX Text Extractor</text>

  <rect x="810" y="735" width="220" height="45" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1" />
  <text x="920" y="763" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="500">LLM (OpenAI / Gemini / Claude)</text>
</svg>
